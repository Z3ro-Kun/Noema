# The local development stack: Postgres with pgvector, Redis, the API and the
# RQ worker, on one machine.
#
# Deliberately not a production manifest. The two application services bind
# ./backend into the container so an edit is picked up without a rebuild,
# which means the image's own copy of the code is shadowed by the host tree --
# right for development, wrong everywhere else. A deployment builds
# backend/Dockerfile and backend/worker/Dockerfile and supplies configuration
# through the environment; see docs/deployment.md.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-multitheme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multitheme}
      POSTGRES_DB: ${POSTGRES_DB:-multitheme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multitheme}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-multitheme}:${POSTGRES_PASSWORD:-multitheme}@db:5432/${POSTGRES_DB:-multitheme}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-multitheme}:${POSTGRES_PASSWORD:-multitheme}@db:5432/${POSTGRES_DB:-multitheme}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-multitheme}:${POSTGRES_PASSWORD:-multitheme}@db:5432/${POSTGRES_DB:-multitheme}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-multitheme}:${POSTGRES_PASSWORD:-multitheme}@db:5432/${POSTGRES_DB:-multitheme}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
